name: Build container image
description: Set up Buildx and build the image from the checked-out source.

inputs:
  platforms:
    description: Platforms to build.
    required: true
  load:
    description: Load the image into Docker.
    default: 'false'
  push:
    description: Push the image to its registry.
    default: 'false'
  tags:
    description: Image tags.
    required: true
  labels:
    description: Image labels.
  cache-from:
    description: Build cache sources.
    required: true
  cache-to:
    description: Build cache destination.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      id: buildx
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        platforms: ${{ inputs.platforms }}
        load: ${{ inputs.load }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
