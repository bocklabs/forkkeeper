name: Sync selected forks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional: one selected fork (owner/repo); empty means all"
        required: false
        type: string
      mode:
        description: "Synchronization strategy"
        required: true
        default: "direct"
        type: choice
        options:
          - direct
          - pr
      dry_run:
        description: "Only inspect changes; do not write"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: forkkeeper-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create installation-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FORKKEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FORKKEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
      - name: Synchronize forks
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ inputs.repository }}
          SYNC_MODE: ${{ inputs.mode || 'direct' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          args=(--mode "$SYNC_MODE")
          if [[ -n "$TARGET_REPO" ]]; then
            args+=(--repo "$TARGET_REPO")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 src/forkkeeper/sync.py "${args[@]}"
