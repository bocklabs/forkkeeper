name: Container image

on:
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Tag created by Release Please
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - name: Build test image
        uses: ./.github/actions/build-image
        with:
          platforms: linux/amd64
          load: true
          tags: forkkeeper:ci
          cache-from: type=gha,scope=forkkeeper-test-amd64
          cache-to: type=gha,scope=forkkeeper-test-amd64,mode=max
      - name: Check CLI help
        run: docker run --rm forkkeeper:ci --help
      - name: Check runtime user and Git
        run: docker run --rm --entrypoint /bin/sh forkkeeper:ci -ec 'test "$(id -u)" = 10001; git --version'
      - name: Run container tests
        run: |
          docker run --rm \
            --mount type=bind,source="${{ github.workspace }}/tests",target=/app/tests,readonly \
            --entrypoint python forkkeeper:ci -m unittest discover -s /app/tests -v

  publish:
    needs: image
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ needs.image.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: type=raw,value=${{ inputs.release_tag }}
          labels: org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: ./.github/actions/build-image
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=forkkeeper-publish
            type=gha,scope=forkkeeper-test-amd64
          cache-to: type=gha,scope=forkkeeper-publish,mode=max
