[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bocklabs-forkkeeper"
version = "0.2.0"
description = "GitHub App-managed fork synchronization for selected organization repositories"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{ name = "Bocklabs" }]
dependencies = ["PyJWT[crypto]>=2.10,<3"]

[dependency-groups]
dev = ["mypy>=2.4,<3"]

[project.scripts]
forkkeeper = "forkkeeper.sync:main"
forkkeeper-public = "forkkeeper.controller:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
