[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bocklabs-forkkeeper"
version = "0.1.0"
description = "GitHub App-managed fork synchronization for selected organization repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Bocklabs" }]
dependencies = []

[project.scripts]
forkkeeper = "forkkeeper.sync:main"

[tool.setuptools.packages.find]
where = ["src"]
